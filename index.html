.tile:nth-child(3n+2){border-radius:10px 30px 30px 30px}.tile:nth-child(3n){border-radius:30px 10px 30px 30px}
.tile:active{transform:scale(.94) rotate(-2deg)}

.vis.num{font-size:72px;font-weight:800;color:var(--blue)}
.dot{width:74px;height:74px;border-radius:50%;border:5px solid rgba(0,0,0,.15);display:block}
.en{font-size:25px;font-weight:800;margin-top:4px;line-height:1.1}.en.sm{font-size:19px}
.id{font-size:16px;opacity:.75}

.qcard{background:var(--card);border-radius:36px;padding:18px;border-bottom:8px solid rgba(0,0,0,.12)}

.qt{font-size:34px;font-weight:800;line-height:1.15}
.qp{font-size:19px;margin-top:6px}
.say{background:#FFB02E;color:#2B2A4C;border-radius:999px;padding:5px 20px;font-size:19px;font-weight:700;margin-top:8px}
.opts{display:grid;gap:12px;margin-top:14px}
.opt{background:var(--card);border-radius:24px;padding:12px;font-size:24px;font-weight:800;border-bottom:6px solid rgba(0,0,0,.12)}

.msg{min-height:34px;margin-top:10px;font-size:21px;font-weight:800}

 return h+'</div>'}
function level(){
 var L=LEVELS[S.li],T=L.th[S.ti],h=topbar('home')+'<div class="band" style="background:'+L.c+';color:'+L.f+'">'+L.e+' '+L.n+'<small>'+L.d+'</small></div><div class="cats">';
 L.th.forEach(function(t,i){h+='<button class="cat" data-a="th" data-i="'+i+'"'+(i===S.ti?' style="background:'+L.c+';color:'+L.f+'"':'')+'>'+t.i+' '+t.n+'</button>'});
 h+='</div><button class="play" data-a="play">🎮 Main Kuis</button><div class="grid">';
 T.items.forEach(function(it,i){h+='<button class="tile" data-a="tile" data-i="'+i+'" aria-label="'+it.en+', '+it.id+'"><div class="vis'+(isNum(it.v)?' num':'')+'">'+vis(it.v)+'</div><div class="en'+(it.en.length>13?' sm':'')+'">'+it.en+'</div><div class="id">'+it.id+'</div></button>'});
 return h+'</div>'}
function startQuiz(){
 var L=LEVELS[S.li],all=[];L.th.forEach(function(T){all=all.concat(T.items)});
 var n=L.id==='l1'?3:4;
 S.q=shuffle(all).slice(0,L.nq||10).map(function(it){
  var ms=L.m.filter(function(m){return !(m==='pic'&&it.np)}),mode=ms[Math.floor(Math.random()*ms.length)];
  var txt=function(x){return mode==='en'?x.id:x.en};
  var same=shuffle(all.filter(function(x){return x!==it&&x.t===it.t})),rest=shuffle(all.filter(function(x){return x!==it&&x.t!==it.t})),o=[it];
  same.concat(rest).forEach(function(x){if(o.length<n&&!o.some(function(y){return txt(y)===txt(x)}))o.push(x)});
  o=shuffle(o);return{it:it,mode:mode,o:o,ci:o.indexOf(it),txt:txt,miss:false}});
 S.qi=0;S.sc=0;S.lock=false;S.view='quiz';render();askSpeak()}
function askSpeak(){var q=S.q[S.qi];if(q&&(q.mode==='hear'||q.mode==='en'))setTimeout(function(){speak(q.it.en)},350)}
function quiz(){
 var q=S.q[S.qi],it=q.it,L=LEVELS[S.li],qv,pr;
 if(q.mode==='pic'){qv='<div class="qv'+(isNum(it.v)?' num':'')+'">'+vis(it.v)+'</div>';pr='Apa bahasa Inggrisnya?'}
 else if(q.mode==='hear'){qv='<div class="qv">🔊</div>';pr='Dengarkan, lalu pilih yang benar.'}
 else if(q.mode==='id'){qv='<div class="qv"><span class="qt">'+it.id+'</span></div>';pr='Apa bahasa Inggrisnya?'}
 else{qv='<div class="qv"><span class="qt">'+it.en+'</span></div>';pr='Apa artinya?'}
 var h='<div class="top"><button class="ib" data-a="level">✕ Keluar</button><span class="chip">⭐ '+S.sc+'</span></div><div class="bar"><i style="width:'+(S.qi/S.q.length*100)+'%"></i></div><div class="quiz"><div class="qcard" style="border-top:10px solid '+L.c+'">'+qv+'<div class="qp">'+pr+'</div><button class="say" data-a="say">🔊 Dengar</button></div><div class="opts">';
 q.o.forEach(function(x,i){h+='<button class="opt" data-a="opt" data-i="'+i+'">'+q.txt(x)+'</button>'});
 return h+'</div><div class="msg" id="msg" aria-live="polite"></div></div>'}
function result(){
 var r=S.sc/S.q.length,st=r>=.9?3:r>=.6?2:1,L=LEVELS[S.li];
 return topbar()+'<div class="res"><div class="big">'+(st===3?'🏆':st===2?'🎉':'💪')+'</div><div class="sc">'+S.sc+' / '+S.q.length+'</div><div class="big">'+stars(st)+'</div><p>'+(st===3?'Luar biasa! Kamu hebat sekali!':st===2?'Bagus! Sedikit lagi sempurna!':'Ayo coba lagi, pasti bisa!')+'</p><button class="b1" data-a="play">🎮 Main lagi</button><button class="b2" data-a="level">📖 Belajar kata lagi</button><button class="b2" data-a="home">🏠 Pilih level lain</button></div>'}
function render(){app.innerHTML=S.view==='home'?home():S.view==='level'?level():S.view==='quiz'?quiz():result()}
function go(v){S.view=v;render();window.scrollTo(0,0)}
function finish(){var L=LEVELS[S.li],r=S.sc/S.q.length,st=r>=.9?3:r>=.6?2:1;
 if(st>(S.best[L.id]||0)){S.best[L.id]=st;try{localStorage.setItem('satu-best',JSON.stringify(S.best))}catch(e){}}
 sfx('win');burst();go('result')}

app.addEventListener('click',function(e){
 var b=e.target.closest('button');if(!b)return;var a=b.dataset.a,i=+b.dataset.i,L=LEVELS[S.li];
 if(a==='lv'){S.li=i;S.ti=0;sfx('tap');go('level')}
 else if(a==='home')go('home');
 else if(a==='level'){try{speechSynthesis.cancel()}catch(x){}go('level')}
 else if(a==='th'){S.ti=i;sfx('tap');render()}
 else if(a==='tile'){sfx('tap');speak(L.th[S.ti].items[i].en)}
 else if(a==='play'){sfx('tap');startQuiz()}
 else if(a==='say'){speak(S.q[S.qi].it.en)}
 else if(a==='mute'){S.mute=!S.mute;if(S.mute){try{speechSynthesis.cancel()}catch(x){}}render()}
 else if(a==='opt'&&!S.lock){
  var q=S.q[S.qi],m=document.getElementById('msg');
  if(i===q.ci){S.lock=true;b.classList.add('ok');if(!q.miss)S.sc++;sfx('ok');
   m.textContent='Hebat! 🎉 '+q.it.en+' = '+q.it.id;speak(q.it.en,CHEERS[Math.floor(Math.random()*5)]);
   setTimeout(function(){S.qi++;S.lock=false;if(S.qi>=S.q.length)finish();else{render();askSpeak()}},1900)}
  else{q.miss=true;b.classList.remove('no');void b.offsetWidth;b.classList.add('no');sfx('no');m.textContent='Coba lagi ya! 💪'}}
});

document.getElementById('foot').innerHTML='<b>'+BRAND.nama+'</b><br>'+BRAND.slogan+(BRAND.wa?'<br><a href="https://wa.me/'+BRAND.wa+'">💬 Hubungi kami</a>':'');
render();
